<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Data Science Portfolio | 20 Production-Grade Systems</title>
  <meta name="description" content="Interactive developer-grade visualizer for 20 end-to-end data science projects across Healthcare, Fintech, E-Commerce, Vision, NLP, and GenAI." />

  <!-- Developer Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar Project Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">DS PORTFOLIO SUITE</div>
        <div class="brand-title">Production ML Catalog</div>
        <div class="brand-subtitle">20 Verified End-to-End Projects</div>
      </div>

      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search by algorithm, domain..." 
          autocomplete="off"
        />
      </div>

      <!-- Navigation Tree Grouped by Tier -->
      <nav class="project-nav-list" id="project-nav-list">
        <!-- Rendered dynamically by sidebar.js -->
      </nav>
    </aside>

    <!-- Main Viewport Area -->
    <main class="main-content" id="main-content-scroll">
      
      <!-- Sticky Top Bar -->
      <header class="top-bar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-btn" onclick="App.toggleMobileMenu()" aria-label="Toggle Menu">
            ☰
          </button>
          <div class="top-stats">
            <span class="stat-pill">Catalog: <strong>20 Projects</strong></span>
            <span class="stat-pill">•</span>
            <span class="stat-pill">Domains: <strong>10+ Verticals</strong></span>
            <span class="stat-pill">•</span>
            <span class="stat-pill">Verification: <strong style="color: var(--accent-emerald);">20/20 Passing</strong></span>
          </div>
        </div>

        <div class="top-actions">
          <button onclick="App.showDashboard()" class="btn-github" style="cursor: pointer;">
            Overview Dashboard
          </button>
          <a href="https://github.com/Sonal-sp/DataScience_Portfolio" target="_blank" rel="noopener noreferrer" class="btn-github">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub Repository
          </a>
        </div>
      </header>

      <!-- Dynamic Viewport Area (Dashboard or Project Detail) -->
      <section id="viewport-container">
        <!-- Rendered dynamically by App state -->
      </section>

    </main>
  </div>

  <!-- Scripts -->
  <script src="js/projects_data.js"></script>
  <script src="js/visualizations/charts.js"></script>
  <script src="js/visualizations/interactive_sims.js"></script>
  <script src="js/visualizations/canvas_animations.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/project_detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
